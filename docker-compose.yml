services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: formly
      POSTGRES_PASSWORD: local-formly-only
      POSTGRES_DB: formly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - formly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formly -d formly"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  formly-postgres:
